<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>colors</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
        <!-- text color -->
  <h1>welcome to ttaileindcss</h1> 
  <h1 class="text-orange-600">welcome to tailweindcss</h1>  
  <h1 class="text-orange-700">welcome to tailweindcss</h1>  
  <h1 class="text-orange-800">welcome to tailweindcss</h1>  
  <h1 class="text-orange-900">welcome to tailweindcss</h1>  
  <h1 class="text-orange-950">welcome to tailweindcss</h1>  
  <!-- background color -->
  <div class="bg-red-200">
    <p>tailweindcss background</p></div>
    <!-- border color -->
     <div class="border border-red-500">
        <p>korodhso aqoon</p>
     </div>
<!-- arbitary colors -->
 <p class="*bg-{#0000ff}">custom color</p>
 <!-- opacity -->
 <p class="bg-red-600/50">hello world</p>

</body>
</html>
