<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>filters</title><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    
   <h1 class="font-bold  text-center text-red-800">filters</h1> 
   <!-- blur -->
      <div class="blur">
        <img src="./images.jfif" alt="">
      </div>
   <!-- brightness -->
    <div class="brightness-10 absolute right-0 top-0 size-20">
        <img src="./images.jfif" alt=""> </div>
        <!-- contrast -->
         <div class="contrast-20 absolute lift-0">
            <img src="./images.jfif" alt="">
         </div>
         <!-- grayscale -->
          <div class="grayscale-150">
            <img src="./images.jfif" alt="">
          </div>
          <div class="grayscale-100">
            <img src="./images.jfif" alt="">
          </div>
          <!-- invert -->
          <div class="invert-400">
            <img src="./images.jfif" alt=""></div>
            <!-- speia -->
             <div class="speia">
                <img src="./images.jfif" alt="">
             </div>
             <!-- hue rutate -->
              <h1>hue rutate</h1>
              <div class="hue-rotate-140">
                <img src="./images.jfif" alt="">
              </div>
              <div class="hue-rotate-180">
                <img src="./images.jfif" alt="">
              </div>
              <!-- saturate -->
               <div class="saturate-50">
                <img src="./images.jfif" alt="">
               </div>
               <!-- drop shadow -->
                <div class="m-5 drop-shadow">
                    <img src="./images.jfif" alt="">
                 

</div>
</body>
</html>
