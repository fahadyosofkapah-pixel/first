<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>transformations</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="p-4 bg-gray-200">
    <h1 class="text-center font-bold">tailwind transformations</h1>
    <button class="bg-blue-500 p-3 rounded text-white font-bold">
      Click me
    </button>
    <!-- scale -->
    <h1 class="font-bold text-2xl text-black-400 my-3">scale</h1>
    <button class="bg-blue-500 p-3 rounded text-white font-bold mx-5 scale-50">
      Click me
    </button>
    <button class="bg-blue-500 p-3 rounded text-white font-bold mx-5 scale-150">
      Click me
    </button>
    <button class="bg-blue-500 p-3 rounded text-white font-bold scale-y-200">
      Click me
    </button>
    <button
      class="bg-blue-500 p-3 rounded text-white font-bold scale-x-200 mx-11"
    >
      Click me
    </button>
    <!-- rotation -->
    <h1 class="font-bold text-2xl text-black-400 my-3">rotation</h1>
    <button class="bg-blue-500 p-3 rounded text-white font-bold m-4 rotate-45">
      Click me
    </button>
    <button class="bg-blue-500 p-3 rounded text-white font-bold m-4 -rotate-45">
      Click me
    </button>
    <button class="bg-blue-500 p-3 rounded text-white font-bold m-4 rotate-90">
      Click me
    </button>
    <button class="bg-blue-500 p-3 rounded text-white font-bold m-4 -rotate-90">
      Click me
    </button>
    <!-- translation -->
    <h1 class="font-bold text-2xl text-black-400 my-3">translation</h1>
    <button class="bg-blue-500 p-3 rounded text-white font-bold -translate-x-4">
      Click me
    </button>
    <button class="bg-blue-500 p-3 rounded text-white font-bold translate-x-11">
      Click me
    </button>
    <button class="bg-blue-500 p-3 rounded text-white font-bold translate-y-9">
      Click me
    </button>
    <button class="bg-blue-500 p-3 rounded text-white font-bold -translate-y-5">
      Click me
    </button>
    <!-- skew -->
    <h1 class="font-bold text-2xl text-black-400 my-3">skew</h1>
    <button class="bg-blue-500 p-3 rounded text-white font-bold skew-y-5">
      Click me
    </button>
    <button class="bg-blue-500 p-3 rounded text-white font-bold skew-x-9">
      Click me
    </button>
    <button class="bg-blue-500 p-3 rounded text-white font-bold -skew-y-5">
      Click me
    </button>
  </body>
</html>
