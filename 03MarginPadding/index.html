<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>m&p</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
     <h1>margin and padding</h1>
     <!-- margin -->
     <h1 class="bg-blue-400 m-5">margin all</h1>
     <h1 class="bg-blue-400 ml-5">margin left</h1>
     <h1 class="bg-blue-400 mt-5">margin right</h1>
     <h1 class="bg-blue-400 my-5">margin top and button</h1>
     <h1 class="bg-blue-400 mx-5">margin left and right</h1>
     <h1 class="bg-blue-400 w-24 mx-auto mt-5">center</h1>
    <!-- padding -->
    <div class="bg-blue-300 p-4 mt-2 ">
        <p class="bg-blue-500">padding all</p>
    </div>
    <div class="bg-blue-300 pl-4 mt-2 ">
        <p class="bg-blue-500">padding left</p>
    </div>
    <div class="bg-blue-300 pr-4 mt-2 ">
        <p class="bg-blue-500">padding right</p>
    </div>
    <div class="bg-blue-300 pt-4 mt-2 ">
        <p class="bg-blue-500">padding top</p>
    </div>
</body>
</html>
